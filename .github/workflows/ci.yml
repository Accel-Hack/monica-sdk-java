name: ci

# Java SDK の検査。見るのは 2 つ。
#
#   - test: 対応する Java の下限（11）、公開に使う 17、現行の LTS 手前で挙動が変わりやすい
#           18 で `mvn verify` が通ること。Spring Boot 4 starter は Java 17 以上で有効になる
#           profile（spring-boot4）にあるので、11 の job では build されない。
#           21 は Spring Boot 4 starter を使うアプリの Java。virtual threads の scheduler の
#           test が走るのもこの job だけ（17・18 では skip）。
#           契約テスト（core の ProtocolContractTest）もここで走る。spec/ の vendoring した
#           コピーを読むだけなので network は要らない
#   - spec: 取り込んだ公開契約が配信元から動いていないこと
#
# 移設元は Accel-Hack/monica の .github/workflows/ci.yml にあった java-sdk-runtime。
# pom.xml が root に来たので `-f sdk/java/pom.xml` を落としている。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "18", "21"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            pom.xml
            */pom.xml

      - name: 取り込んだ specが lockと一致するか
        # 契約テストも同じ照合をするが、こちらの方が落ちた理由が読みやすい。
        run: python3 scripts/spec-sync.py --check

      - run: mvn --batch-mode --no-transfer-progress verify

  spec:
    # 配信元を叩くので matrix から外してある。network の失敗で各 Java 版の
    # job が道連れになると、落ちた理由が読めなくなる。
    name: 公開契約
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: 取り込んだ specが配信元と一致するか
        # spec/ は https://spec.monica.accelhack.net/v1/ のコピー。配信元の
        # index.json の revision を取り込み済みのものと比べるだけなので安い。
        # ここが落ちたら python3 scripts/spec-sync.py で取り込み直し、
        # mvn verify を通してから commit する。
        run: python3 scripts/spec-sync.py --check-remote
