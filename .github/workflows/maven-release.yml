name: Maven release

# pom.xml を X.Y.Z-SNAPSHOT へ更新して main へ merge した後、
# vX.Y.Z tag をその commit へ付けると GitHub Packages へ公開する。
# repository が Maven の artifact しか出さないので、tag に maven- の prefix は付けない。
#
# 公開先が同じ repository の GitHub Packages なので、認証は自動で渡る GITHUB_TOKEN で
# 足りる。公開のための secret は要らない。GPG 署名も要求されないので付けていない。
#
# 同じ version は再公開できない（409 で落ちる）ので、公開済みの版を直すときは
# patch version を上げる。deploy するのは下の step が tag から作る release version で、
# SNAPSHOT は公開しない。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: maven-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Java SDKをGitHub Packagesへ公開
    # fork で tag を打っても、その fork の package へ publish しに行かないように。
    if: github.repository == 'Accel-Hack/monica-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: |
            pom.xml
            */pom.xml
          # setup-java v5ではcredential値ではなく、deploy stepで設定する
          # environment variable名を以下のinputへ渡す。
          # server-idはpom.xmlのdistributionManagementのidと一致させる。
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: tag・main・POM versionを検証
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release tagはmainに含まれるcommitへ付けてください。"
            exit 1
          }

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tagはvX.Y.Z形式にしてください。"
            exit 1
          fi
          pom_version=$(mvn --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$pom_version" != "$tag_version-SNAPSHOT" ]]; then
            echo "::error::tag=$tag_version POM=$pom_version。POMを$tag_version-SNAPSHOTへ更新してください。"
            exit 1
          fi

          mvn --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$tag_version" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: GitHub Packagesへ公開
        run: >-
          mvn --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
